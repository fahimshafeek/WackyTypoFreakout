services:
  n8n:
    image: n8nio/n8n:latest
    container_name: type_and_atone_n8n
    restart: unless-stopped
    ports:
      - "5679:5678" # Used 5679 to prevent clash with venture n8n if run simultaneously
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  n8n_data:
